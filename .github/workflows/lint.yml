name: Linting check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'

      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('s2_cem_lib/pyproject.toml', 'examples/homeassistant/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install s2_cem_lib dev deps
        run: |
          cd s2_cem_lib
          pip install -e '.[dev]'

      - name: Run ruff on s2_cem_lib
        run: |
          cd s2_cem_lib
          ruff check

      - name: Install HA example dev deps
        run: |
          pip install -e s2_cem_lib
          cd examples/homeassistant
          pip install -e '.[dev]'

      - name: Run ruff on HA example
        run: |
          cd examples/homeassistant
          ruff check
