name: Tests and SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'

      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('s2_cem_lib/pyproject.toml', 'examples/homeassistant/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install s2_cem_lib dev deps
        run: |
          cd s2_cem_lib
          pip install -e '.[dev]'

      - name: Test s2_cem_lib
        run: |
          cd s2_cem_lib
          coverage run
          coverage report
          coverage html
          coverage xml

      - name: Upload s2_cem_lib coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cem-lib
          path: s2_cem_lib/htmlcov/**
          retention-days: 3

      - name: Install HA example dev deps
        run: |
          pip install -e s2_cem_lib
          cd examples/homeassistant
          pip install -e '.[dev]'

      - name: Test HA example
        run: |
          cd examples/homeassistant
          coverage run
          coverage report
          coverage html
          coverage xml

      - name: Upload HA example coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-ha
          path: examples/homeassistant/htmlcov/**
          retention-days: 3

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    if: |
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download s2_cem_lib coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-cem-lib
          path: s2_cem_lib

      - name: Download HA example coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-ha
          path: examples/homeassistant

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_USER_HOME: ${{ github.workspace }}/.sonar
          SONAR_QUALITYGATE_WAIT: "true"
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT }} \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.sources=src \
            -Dsonar.tests=tests
