[project]
name = "s2-cem-lib"
version = "1.0.0"
license = "Apache-2.0"
description = "S2 CEM engine — pairing, connection, and PEBC for any HEMS platform"
requires-python = ">=3.13"
dependencies = [
    "s2-python>=0.9.1",
    "aiohttp>=3.13.3",
    "zeroconf>=0.148.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.13.4",
    "pip-audit>=2.10.0",
    "pip-licenses>=5.5.1",
    "setuptools>=83.0.0"
]

[project.urls]
Repository = "https://github.com/ElaadNL/resflex-open-s2-hems-connector"

[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 160
src = ["s2_cem_lib"]
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
command_line = "-m pytest"
source = ["s2_cem_lib"]
